<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lensy.film – Cinematic Stories. Captured Differently.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F0E6;--ink:#171717;--card:#FBF8F1;--bei:#E8DFD0;--mut:#5F5A50;--line:#D9CFBD;--gold:#C9A96E;--sage:#879484;--dk:#171717;--lt:#F5F0E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--ink:#F5F0E6;--card:#1D1B18;--bei:#2A2722;--mut:#B5AD9D;--line:#37332C}}
:root[data-theme="dark"]{--bg:#121110;--ink:#F5F0E6;--card:#1D1B18;--bei:#2A2722;--mut:#B5AD9D;--line:#37332C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--dk);z-index:10}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,8vw,3.8rem)}h2{font-size:clamp(1.6rem,5vw,2.3rem)}h3{font-size:1.25rem}
p{margin:0 0 1em}a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--dk);color:var(--lt);display:flex;align-items:center;justify-content:space-between;padding:8px 18px;flex-wrap:wrap}
.logo img{height:38px;display:block;mix-blend-mode:lighten}
#mb{background:none;border:1px solid #4a463f;color:var(--lt);border-radius:999px;padding:7px 16px;font:500 14px Manrope,sans-serif;cursor:pointer}
nav{display:none;width:100%;padding:8px 0 12px}nav.open{display:flex;flex-direction:column}
nav a{text-decoration:none;padding:11px 4px;border-bottom:1px solid #2c2925;color:var(--lt)}nav a.on{color:var(--gold)}
@media(min-width:860px){#mb{display:none}nav,nav.open{display:flex;flex-direction:row;width:auto;padding:0;gap:6px}nav a{border:0;padding:8px 12px;border-radius:999px}nav a:hover{background:#2a2722}}
main{max-width:1060px;margin:0 auto;padding:0 18px 56px}
section{padding:40px 0}
.hero{background:var(--dk);color:var(--lt);margin:0 -18px;padding:44px 18px 52px;animation:rise .7s ease both}
.hero .in{max-width:1060px;margin:0 auto}
.hero img{width:min(78%,340px);display:block;mix-blend-mode:lighten;margin-bottom:26px}
.hero p{max-width:46ch;color:#d6cfc0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 24px;font:700 15px Manrope,sans-serif;cursor:pointer;text-decoration:none;background:var(--gold);color:#171717;margin:4px 8px 4px 0;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.o{background:none;border:1.5px solid currentColor;color:inherit}.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{border:1px solid var(--sage);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--mut);background:var(--card)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cat{background:var(--bei);border-radius:14px;padding:22px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;width:100%}
.cat b{font:700 1.2rem Fraunces,serif;display:block;margin-bottom:6px}.cat span{color:var(--mut);font-size:14px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.06);display:flex;flex-direction:column}
.pc.sel{border-color:var(--gold)}.pc .pr{font:700 2rem Fraunces,serif;margin:2px 0}.pc small{color:var(--mut)}
ul.f{list-style:none;padding:0;margin:14px 0;flex:1}ul.f li{padding:3px 0 3px 24px;position:relative;font-size:14.5px}ul.f li::before{content:"✓";position:absolute;left:0;color:var(--sage);font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{white-space:nowrap;border:1.5px solid var(--line);background:none;color:inherit;border-radius:999px;padding:9px 18px;font:500 14px Manrope,sans-serif;cursor:pointer}.tab.on{background:var(--dk);color:var(--lt);border-color:var(--dk)}
.steps{display:flex;gap:6px;margin:8px 0 22px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.d{background:var(--gold)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}.row.t{font-weight:700;border-bottom:0}
.q{display:flex;align-items:center;gap:10px}.q button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:none;color:inherit;font-size:18px;cursor:pointer}
.err{color:#b3392f;font-size:14px;margin:8px 0;min-height:1em}
.how{counter-reset:s;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.how div{counter-increment:s;background:var(--bei);border-radius:14px;padding:18px}.how div::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--dk);color:var(--gold);font-weight:700;margin-bottom:8px}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;max-height:230px;overflow-y:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-top:4px;box-shadow:0 8px 20px rgba(0,0,0,.12)}.sug button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 14px;cursor:pointer}.sug button.m{font-weight:700;background:var(--bei)}.sug small{color:var(--mut);font-weight:400}
footer{background:var(--dk);color:#cfc8b9;padding:28px 18px;font-size:14px;text-align:center}footer a{color:var(--gold)}
</style>
</head>

services(){const S=SV[st.tab];return `<section><h2>Services & pricing</h2><div class="tabs">${Object.entries(SV).map(([k,s])=>`<button class="tab ${k===st.tab?"on":""}" data-a="tab" data-v="${k}">${s.n}</button>`).join("")}</div><p>${S.d} Prices are base prices${GST_ON?" before "+GST_RATE+"% GST":""}.</p>
<div class="grid">${S.pk.map(p=>card(st.tab,p)).join("")}</div>
<h3 style="margin-top:32px">Add-ons</h3>${AD[st.tab]?`<div class="box">${AD[st.tab].map(a=>`<div class="row"><span>${a[0]}</span><b>${inr(a[1]*100)}</b></div>`).join("")}</div>`:`<div class="box">Extra shooting time and custom editing requests are quoted by Lensy.film. Describe them in your booking.</div>`}</section>`},
book(){if(st.done)return confirmView();const s=st.step,labels=["Service","Package","Details","Summary","Confirm"];
let h=`<section><h2>Book a shoot</h2><div class="steps">${labels.map((_,i)=>`<i class="${i<s?"d":""}"></i>`).join("")}</div><p><b>Step ${s} of 5:</b> ${labels[s-1]}</p>`;
if(s===1)h+=`<div class="grid">${Object.entries(SV).map(([k,v])=>`<button class="cat" data-a="svc" data-v="${k}"><b>${v.n}</b><span>${v.d}</span></button>`).join("")}</div>`;
if(s===2){h+=`<div class="grid">${SV[st.svc].pk.map(p=>card(st.svc,p,1)).join("")}</div>`;
const S=SV[st.svc];if(S.ph&&st.pk==="standard")h+=`<div class="box"><label style="display:flex;gap:10px;align-items:center;margin:0"><input type="checkbox" style="width:auto" data-a="photo" ${st.photo?"checked":""}> Add photography: ${S.ph[1]} (+${inr(S.ph[0]*100)})</label></div>`;
if(AD[st.svc])h+=`<div class="box"><b>Optional add-ons</b>${AD[st.svc].map((a,i)=>`<div class="row"><span>${a[0]}<br><small>${inr(a[1]*100)} each</small></span><span class="q"><button data-a="q" data-v="${i}|-1" aria-label="Remove one">−</button><b>${st.add[i]||0}</b><button data-a="q" data-v="${i}|1" aria-label="Add one">+</button></span></div>`).join("")}</div>`;
else h+=`<div class="box">Extra shooting time or custom editing? Mention it in the next step and Lensy.film will quote it.</div>`;h+=tot();}
if(s===3)h+=form();if(s===4||s===5)h+=(s===4?cbox():"")+summary(s===5);
h+=`<div class="err" id="err" role="alert"></div>`;
if(s>1)h+=`<button class="btn o" data-a="back" style="color:var(--ink)">Back</button>`;
if(s>1&&s<5)h+=`<button class="btn" id="nx" data-a="next">${s===4?"Review booking":"Continue"}</button>`;
if(s===5)h+=`<button class="btn" data-a="confirm">Confirm booking</button>`;
return h+"</section>"},
bookings(){const l=load();return `<section><h2>My bookings</h2><div class="note">Bookings are saved on this device only. Sign-in, live status tracking, payments and downloads need the backend, which isn’t connected yet.</div><br>${l.length?l.map(b=>`<div class="box"><b>${esc(b.id)}</b><br>${esc(b.svc)} · ${esc(b.pk)}<br>${esc(b.date)} at ${esc(b.time)}, ${esc(b.city)}<div class="row t"><span>Total</span><span>${inr(b.total)}</span></div><small>Status: Requested. Waiting for Lensy.film to confirm on WhatsApp.</small></div>`).join(""):`<p>No bookings yet.</p><a class="btn" href="#book">Book a shoot</a>`}</section>`},
about(){return `<section><h2>About Lensy.film</h2><p>Lensy.film is a small creative studio in Jagtial, Telangana. We shoot and edit on iPhone, with a focus on short cinematic films: birthdays, weddings, creator reels and new vehicle deliveries.</p><p>Cinematic Stories. Captured Differently.</p><a class="btn" href="#book">Book Your Shoot</a></section>`},
contact(){return `<section><h2>Contact us</h2><div class="box"><p>Jagtial, Telangana</p><p><a href="${wa()}" target="_blank" rel="noopener">Chat on WhatsApp (+91 93980 23493)</a></p><p><a href="https://instagram.com/${IG}" target="_blank" rel="noopener">Instagram @${IG}</a></p></div></section>`}};
function tot(){const c=calc();if(!c)return"";return `<div class="box">${c.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><span>${inr(l[1])}</span></div>`).join("")}<div class="row t"><span>Running total${gstTag}</span><span>${inr(c.total)}</span></div></div>`}
const DISTS=["Adilabad","Bhadradri Kothagudem","Hanumakonda","Hyderabad","Jagtial","Jangaon","Jayashankar Bhupalpally","Jogulamba Gadwal","Kamareddy","Karimnagar","Khammam","Kumuram Bheem Asifabad","Mahabubabad","Mahabubnagar","Mancherial","Medak","Medchal–Malkajgiri","Mulugu","Nagarkurnool","Nalgonda","Narayanpet","Nirmal","Nizamabad","Peddapalli","Rajanna Sircilla","Rangareddy","Sangareddy","Siddipet","Suryapet","Vikarabad","Wanaparthy","Warangal","Yadadri Bhuvanagiri"],AREA=["Jagtial","Karimnagar","Hyderabad"];
const findD=v=>DISTS.find(x=>x.toLowerCase()===String(v||"").trim().toLowerCase());
function areaMsg(v){const d=findD(v);if(!d)return"Shoots are currently available near Jagtial, Karimnagar and Hyderabad.";return AREA.includes(d)?"✓ We shoot in "+d+".":d+" is outside our current area (Jagtial, Karimnagar, Hyderabad). You can still send a request and Lensy.film will tell you if it is possible."}
function sugHtml(q){q=String(q||"").trim().toLowerCase();const m=d=>q&&d.toLowerCase().includes(q),sw=d=>d.toLowerCase().startsWith(q);
const a=DISTS.filter(sw),b=DISTS.filter(d=>m(d)&&!sw(d)),c=DISTS.filter(d=>!m(d)&&!sw(d));
return q?[...a,...b].map(d=>[d,1]).concat(c.map(d=>[d,0])).map(([d,x])=>`<button type="button" class="${x?"m":""}" data-a="pick" data-v="${d}">${d}<small>${AREA.includes(d)?"Available":""}</small></button>`).join(""):DISTS.map(d=>`<button type="button" data-a="pick" data-v="${d}">${d}<small>${AREA.includes(d)?"Available":""}</small></button>`).join("")}
function showSug(){const s=$("#sug"),i=$("#dist");if(!s||!i)return;s.innerHTML=sugHtml(i.value);s.hidden=false;$("#areaNote").textContent=areaMsg(i.value)}
function fld(k,l,t="text",ph=""){return `<label>${l}</label><input data-f="${k}" type="${t}" placeholder="${ph}" value="${esc(st.f[k])}">`}
function form(){const v=st.svc==="vehicle",today=minDate();
return `<div class="box">${fld("name","Full name")}${fld("phone","Mobile number","tel","10-digit number")}${fld("email","Email address","email")}
<label>Preferred shoot date (earliest: ${niceDate(today)})</label><input data-f="date" type="date" min="${today}" value="${esc(st.f.date)}">${fld("time","Preferred shoot time","time")}${fld("loc","Shoot location")}<label for="st">State</label><select id="st"><option>Telangana</option></select><label for="dist">District</label><div style="position:relative"><input id="dist" data-f="city" data-dist="1" autocomplete="off" placeholder="Type to search, e.g. Jag" value="${esc(st.f.city)}"><div id="sug" class="sug" hidden></div></div><div id="areaNote" class="note" style="margin-top:8px">${areaMsg(st.f.city)}</div>
${v?`<label>Vehicle type</label><select data-f="vtype">${["Car","Bike","Other"].map(x=>`<option ${st.f.vtype===x?"selected":""}>${x}</option>`).join("")}</select>${fld("vbrand","Vehicle brand")}${fld("vmodel","Vehicle model")}${fld("showroom","Showroom name")}`:""}
<label>Additional requirements</label><textarea data-f="req" rows="3">${esc(st.f.req)}</textarea></div>`}
function summary(final){const c=calc(),f=st.f;return `<div class="box"><b>${SV[st.svc].n} · ${pkg().n}</b>${c.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><span>${inr(l[1])}</span></div>`).join("")}
<div class="row"><span>Subtotal</span><span>${inr(c.base)}</span></div>${c.disc?`<div class="row"><span>Coupon ${esc(st.cpn)} (${cl(st.cpn)})</span><span>−${inr(c.disc)}</span></div>`:""}${GST_ON?`<div class="row"><span>GST (${GST_RATE}%)</span><span>${inr(c.gst)}</span></div>`:""}
<div class="row t"><span>Final total</span><span>${inr(c.total)}</span></div></div>
${final?`<div class="box"><b>${esc(f.name)}</b><br>${esc(f.phone)} · ${esc(f.email)}<br>${esc(f.date)} at ${esc(f.time)}<br>${esc(f.loc)}, ${esc(f.city)}, Telangana${st.svc==="vehicle"?`<br>${esc(f.vtype||"Car")}: ${esc(f.vbrand)} ${esc(f.vmodel)}, ${esc(f.showroom)}`:""}${f.req?`<br>Notes: ${esc(f.req)}`:""}</div>`:""}`}
function minDate(){const d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function niceDate(s){const a=s.split("-");return +a[2]+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][a[1]-1]}
function confirmView(){const b=st.done;return `<section><h2>Booking request created</h2><div class="box"><p>Booking ID</p><h3>${esc(b.id)}</h3><p>${esc(b.svc)} · ${esc(b.pk)} · ${inr(b.total)}</p></div>
<div class="box"><b>Send your booking</b><p>Send it to Lensy.film on WhatsApp (+91 93980 23493). Your booking is confirmed when Lensy.film replies.</p><a class="btn" target="_blank" rel="noopener" href="${wa(b.msg)}">Send on WhatsApp</a></div>
<a href="#bookings">View my bookings</a></section>`}
function newId(){const all="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",used=load().map(b=>b.id);for(;;){const r=new Uint32Array(6);crypto.getRandomValues(r);const s=[...r].map(x=>all[x%all.length]).join("");if(/[A-Z]/.test(s)&&/\d/.test(s)&&!used.includes(s))return s}}
function cbox(){return `<div class="box"><label for="cin" style="margin-top:0">Coupon code</label>${st.cpn?`<p>Applied: <b>${esc(st.cpn)}</b> (${cl(st.cpn)}) <button class="tab" data-a="cpnx">Remove</button></p>`:`<div style="display:flex;gap:8px"><input id="cin" data-f="cin" placeholder="Enter code" autocapitalize="characters" autocomplete="off" value="${esc(st.f.cin)}"><button class="btn" style="margin:0" data-a="coupon">Apply</button></div>`}<div class="err" id="cerr" role="alert"></div></div>`}
function load(){try{return JSON.parse(localStorage.getItem("lensy_bookings")||"[]")}catch(e){return[]}}
function validate(){const f=st.f,ph=String(f.phone||"").replace(/\D/g,"").replace(/^91(?=\d{10}$)/,"");
const need=["name","phone","email","date","time","loc","city"].concat(st.svc==="vehicle"?["vbrand","vmodel","showroom"]:[]);
if(need.some(k=>!String(f[k]||"").trim()))return"Please fill in all required fields.";
if(!/^[6-9]\d{9}$/.test(ph))return"Enter a valid 10-digit Indian mobile number.";
if(!/^\S+@\S+\.\S+$/.test(f.email))return"Enter a valid email address.";const dd=findD(f.city);if(!dd)return"Choose a Telangana district from the list.";f.city=dd;
if(f.date<minDate())return"Shoots can be booked from tomorrow onwards. Earliest date: "+niceDate(minDate())+".";f.phone=ph;return""}
function confirmBooking(){const c=calc(),f=st.f,id=newId();
const msg=`Hi Lensy.film, I’d like to book.\nBooking ID: ${id}\n${SV[st.svc].n} – ${pkg().n}\nName: ${f.name}\nPhone: ${f.phone}\nDate: ${f.date} ${f.time}\nPlace: ${f.loc}, ${f.city}, Telangana\n${st.cpn?"Coupon: "+st.cpn+" ("+cl(st.cpn)+")\n":""}Total: ${inr(c.total)}${f.req?"\nNotes: "+f.req:""}`;
const b={id,svc:SV[st.svc].n,pk:pkg().n,date:f.date,time:f.time,city:f.city,total:c.total,adv:c.adv,msg};
try{const l=load();l.unshift(b);localStorage.setItem("lensy_bookings",JSON.stringify(l))}catch(e){}
if(LIMITED.includes(st.cpn)){try{localStorage.setItem("lensy_used",JSON.stringify([...usedC(),st.cpn]))}catch(e){}}st.done=b;st.step=1;st.svc=st.pk=null;st.photo=false;st.add={};st.cpn=null}
const A={
tab(v){st.tab=v;if(location.hash!=="#services")location.hash="services";else draw()},
choose(v){const[a,b]=v.split("|");if(st.svc!==a)st.add={};st.svc=a;st.pk=b;st.photo=false;st.done=null;st.sn=1;if(st.step<2||location.hash!=="#book")st.step=2;if(location.hash!=="#book")location.hash="book";else draw(1)},
svc(v){st.svc=v;st.pk=null;st.photo=false;st.add={};st.step=2;draw()},
photo(v,el){st.photo=el.checked;draw(1)},
q(v){const[i,d]=v.split("|");st.add[i]=Math.max(0,(st.add[i]||0)+ +d);draw(1)},
back(){st.step=Math.max(1,st.step-1);draw()},
next(){let e="";if(st.step===2&&!st.pk)e="Choose a package to continue.";if(st.step===3)e=validate();
if(e){$("#err").textContent=e;return}st.step++;draw()},
confirm(){confirmBooking();draw()},
coupon(){const c=String($("#cin").value||"").trim().toUpperCase();if(!COUPONS[c]){$("#cerr").textContent="That code isn’t valid.";return}if(LIMITED.includes(c)&&usedC().includes(c)){$("#cerr").textContent="This code has already been used on this device.";return}st.cpn=c;draw(1)},
cpnx(){st.cpn=null;draw(1)},
pick(v){st.f.city=v;$("#dist").value=v;$("#sug").hidden=true;$("#areaNote").textContent=areaMsg(v)}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.type==="checkbox")return;A[el.dataset.a]?.(el.dataset.v,el)});
document.addEventListener("change",e=>{if(e.target.dataset.a==="photo")A.photo(0,e.target)});
document.addEventListener("input",e=>{const k=e.target.dataset.f;if(k)st.f[k]=e.target.value;if(e.target.dataset.dist)showSug()});
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.dist)showSug()});
document.addEventListener("click",e=>{if(!e.target.closest("#dist,#sug")){const s=$("#sug");if(s)s.hidden=true}});
const NAV=[["home","Home"],["services","Services & Pricing"],["book","Book a Shoot"],["bookings","My Bookings"],["about","About"],["contact","Contact"]];
function draw(keep){const h=(location.hash||"#home").slice(1),pg=PAGES[h]?h:"home",y=scrollY;
$("#app").innerHTML=PAGES[pg]();$("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===pg?"on":""}">${n[1]}</a>`).join("");
$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");scrollTo(0,keep?y:0);if(st.sn){st.sn=0;setTimeout(()=>{const n=$("#nx");if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})},80)}}
$("#mb").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
$("#nav").addEventListener("click",e=>{if(e.target.tagName==="A")$("#nav").classList.remove("open")});
addEventListener("hashchange",()=>{if(location.hash!=="#book")st.done=null;draw()});
$("#fwa").href=wa();$("#fgst").textContent=GST_ON?"Prices are base prices before "+GST_RATE+"% GST.":"";
draw();
</script>
</body>
</html>
